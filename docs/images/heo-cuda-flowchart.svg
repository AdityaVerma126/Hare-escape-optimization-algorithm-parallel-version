<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#fffaf2"/><stop offset="1" stop-color="#f5f0ff"/></linearGradient><linearGradient id="gold" x2="0" y2="1"><stop stop-color="#fff1c7"/><stop offset="1" stop-color="#ffe2a0"/></linearGradient><linearGradient id="violet" x2="0" y2="1"><stop stop-color="#f0eaff"/><stop offset="1" stop-color="#dfd2ff"/></linearGradient><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6Z" fill="#344054"/></marker><style>.h{font:700 40px Arial;fill:#171923}.sub{font:600 23px Arial;fill:#596579}.panel{fill:#fff;stroke:#8874c7;stroke-width:2;stroke-dasharray:8 7}.pt{font:700 22px Arial;fill:#25223a}.box{fill:url(#gold);stroke:#b79a54;stroke-width:1.6}.vbox{fill:url(#violet);stroke:#9276d4;stroke-width:1.6}.txt{font:600 19px Arial;fill:#252b36}.small{font:16px Arial;fill:#394150}.cap{font:700 18px Arial;fill:#29243e}.line{stroke:#344054;stroke-width:2.6;fill:none;marker-end:url(#arr)}.muted{font:15px Arial;fill:#667085}</style></defs><rect width="1600" height="1100" rx="28" fill="url(#bg)"/><text x="800" y="62" text-anchor="middle" class="h">HEO CUDA Implementation Flowchart</text><text x="800" y="100" text-anchor="middle" class="sub">GPU parallel implementation • NVIDIA CUDA • CUB radix sort • device-resident population</text><rect x="45" y="145" width="450" height="360" rx="20" class="panel"/><rect x="63" y="159" width="256" height="38" rx="18" fill="#e8ddff"/><text x="81" y="185" class="pt">CUDA device memory</text><rect x="70" y="210" width="400" height="55" rx="15" class="vbox"/><text x="270" y="241" text-anchor="middle" class="txt">X, V : parent positions and velocities (N × D)</text><rect x="70" y="280" width="400" height="55" rx="15" class="vbox"/><text x="270" y="311" text-anchor="middle" class="txt">Xnew, fnew : candidate positions and fitness</text><rect x="70" y="350" width="400" height="55" rx="15" class="vbox"/><text x="270" y="381" text-anchor="middle" class="txt">f, P, idx : fitness, merged population, sort indices</text><rect x="70" y="420" width="400" height="55" rx="15" class="vbox"/><text x="270" y="451" text-anchor="middle" class="txt">bounds and algorithm parameters copied once</text><rect x="45" y="535" width="450" height="475" rx="20" class="panel"/><rect x="63" y="549" width="184" height="38" rx="18" fill="#e8ddff"/><text x="81" y="575" class="pt">CUDA kernels</text><rect x="70" y="600" width="400" height="62" rx="15" class="box"/><text x="270" y="631" text-anchor="middle" class="txt">k_init — initialize positions and velocities</text><rect x="70" y="680" width="400" height="62" rx="15" class="box"/><text x="270" y="711" text-anchor="middle" class="txt">k_update — generate candidates in parallel</text><rect x="70" y="760" width="400" height="62" rx="15" class="box"/><text x="270" y="791" text-anchor="middle" class="txt">k_eval — evaluate candidate fitness</text><rect x="70" y="840" width="400" height="62" rx="15" class="box"/><text x="270" y="871" text-anchor="middle" class="txt">CUB sort + merge-path survivor selection</text><rect x="70" y="920" width="400" height="62" rx="15" class="box"/><text x="270" y="951" text-anchor="middle" class="txt">k_gather — write best N survivors</text><rect x="550" y="145" width="500" height="865" rx="20" class="panel"/><rect x="568" y="159" width="364" height="38" rx="18" fill="#e8ddff"/><text x="586" y="185" class="pt">Host → GPU → Host execution</text><rect x="610" y="215" width="380" height="65" rx="15" class="vbox"/><text x="800" y="246" text-anchor="middle" class="txt">Start • read N, D, T, function and seed</text><path d="M800 280 L800 310" class="line"/><rect x="610" y="310" width="380" height="65" rx="15" class="box"/><text x="800" y="341" text-anchor="middle" class="txt">Select CUDA device and allocate buffers</text><path d="M800 375 L800 405" class="line"/><rect x="610" y="405" width="380" height="65" rx="15" class="box"/><text x="800" y="436" text-anchor="middle" class="txt">Copy constants / bounds to device once</text><path d="M800 470 L800 500" class="line"/><rect x="610" y="500" width="380" height="65" rx="15" class="vbox"/><text x="800" y="531" text-anchor="middle" class="txt">k_init → initialize population and velocity</text><path d="M800 565 L800 595" class="line"/><rect x="610" y="595" width="380" height="65" rx="15" class="vbox"/><text x="800" y="626" text-anchor="middle" class="txt">Evaluate initial fitness (k_eval)</text><path d="M800 660 L800 690" class="line"/><rect x="610" y="690" width="380" height="70" rx="15" class="box"/><text x="800" y="721" text-anchor="middle" class="txt">For t = 1 … T : launch iteration pipeline</text><path d="M800 760 L800 790" class="line"/><rect x="590" y="790" width="420" height="120" rx="15" class="vbox"/><text x="800" y="821" text-anchor="middle" class="txt">1  Update candidates (k_update)</text><text x="800" y="846" text-anchor="middle" class="small">2  Evaluate fitness (k_eval)</text><text x="800" y="871" text-anchor="middle" class="small">3  Sort 2N candidates / parents (CUB)</text><text x="800" y="896" text-anchor="middle" class="small">4  Gather best N (k_gather)</text><path d="M800 910 L800 935" class="line"/><rect x="610" y="935" width="380" height="55" rx="15" class="box"/><text x="800" y="966" text-anchor="middle" class="txt">Copy best result to host; report fitness and time</text><rect x="1100" y="145" width="455" height="360" rx="20" class="panel"/><rect x="1118" y="159" width="364" height="38" rx="18" fill="#e8ddff"/><text x="1136" y="185" class="pt">Per-iteration CUDA pipeline</text><rect x="1130" y="210" width="395" height="62" rx="15" class="box"/><text x="1327.5" y="241" text-anchor="middle" class="txt">k_update : N hare rows updated in parallel</text><path d="M1327 272 L1327 295" class="line"/><rect x="1130" y="295" width="395" height="62" rx="15" class="box"/><text x="1327.5" y="326" text-anchor="middle" class="txt">k_eval : compute f(Xnew) in parallel</text><path d="M1327 357 L1327 380" class="line"/><rect x="1130" y="380" width="395" height="62" rx="15" class="box"/><text x="1327.5" y="411" text-anchor="middle" class="txt">CUB DeviceRadixSort : order 2N candidates</text><path d="M1327 442 L1327 465" class="line"/><rect x="1130" y="465" width="395" height="62" rx="15" class="box"/><text x="1327.5" y="496" text-anchor="middle" class="txt">k_gather : retain best N survivors</text><rect x="1100" y="535" width="455" height="475" rx="20" class="panel"/><rect x="1118" y="549" width="280" height="38" rx="18" fill="#e8ddff"/><text x="1136" y="575" class="pt">Implementation notes</text><rect x="1130" y="605" width="395" height="90" rx="15" class="vbox"/><text x="1327.5" y="636" text-anchor="middle" class="txt">Parallel model: CUDA SIMT</text><text x="1327.5" y="661" text-anchor="middle" class="small">GPU target: Tesla T4 (SM 75)</text><rect x="1130" y="715" width="395" height="90" rx="15" class="box"/><text x="1327.5" y="746" text-anchor="middle" class="txt">Population stays on device</text><text x="1327.5" y="771" text-anchor="middle" class="small">Only final result is copied back</text><rect x="1130" y="825" width="395" height="90" rx="15" class="box"/><text x="1327.5" y="856" text-anchor="middle" class="txt">Timing: CUDA events</text><text x="1327.5" y="881" text-anchor="middle" class="small">Warm-up before measured runs</text><text x="800" y="1055" text-anchor="middle" class="muted">Algorithm details follow heo_common.h: X′ = clamp(X + cₜV + L(X + V)r); V′ = 0.95V</text></svg>