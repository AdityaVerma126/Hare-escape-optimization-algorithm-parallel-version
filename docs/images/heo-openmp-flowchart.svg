<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#fffaf2"/><stop offset="1" stop-color="#f5f0ff"/></linearGradient><linearGradient id="gold" x2="0" y2="1"><stop stop-color="#fff1c7"/><stop offset="1" stop-color="#ffe2a0"/></linearGradient><linearGradient id="violet" x2="0" y2="1"><stop stop-color="#f0eaff"/><stop offset="1" stop-color="#dfd2ff"/></linearGradient><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6Z" fill="#344054"/></marker><style>.h{font:700 40px Arial;fill:#171923}.sub{font:600 23px Arial;fill:#596579}.panel{fill:#fff;stroke:#8874c7;stroke-width:2;stroke-dasharray:8 7}.pt{font:700 22px Arial;fill:#25223a}.box{fill:url(#gold);stroke:#b79a54;stroke-width:1.6}.vbox{fill:url(#violet);stroke:#9276d4;stroke-width:1.6}.txt{font:600 19px Arial;fill:#252b36}.small{font:16px Arial;fill:#394150}.cap{font:700 18px Arial;fill:#29243e}.line{stroke:#344054;stroke-width:2.6;fill:none;marker-end:url(#arr)}.muted{font:15px Arial;fill:#667085}</style></defs><rect width="1600" height="1100" rx="28" fill="url(#bg)"/><text x="800" y="62" text-anchor="middle" class="h">HEO OpenMP Implementation Flowchart</text><text x="800" y="100" text-anchor="middle" class="sub">Shared-memory CPU parallel implementation • configurable OpenMP thread count</text><rect x="45" y="145" width="450" height="350" rx="20" class="panel"/><rect x="63" y="159" width="316" height="38" rx="18" fill="#e8ddff"/><text x="81" y="185" class="pt">Parallel initialization</text><rect x="70" y="215" width="400" height="70" rx="15" class="vbox"/><text x="270" y="246" text-anchor="middle" class="txt">OpenMP parallel loop over N hares</text><rect x="70" y="305" width="400" height="70" rx="15" class="box"/><text x="270" y="336" text-anchor="middle" class="txt">Initialize X within bounds; initialize V</text><rect x="70" y="395" width="400" height="70" rx="15" class="box"/><text x="270" y="426" text-anchor="middle" class="txt">Evaluate initial fitness f(X) in parallel</text><rect x="45" y="525" width="450" height="485" rx="20" class="panel"/><rect x="63" y="539" width="328" height="38" rx="18" fill="#e8ddff"/><text x="81" y="565" class="pt">HEO update per candidate</text><rect x="70" y="600" width="400" height="80" rx="15" class="box"/><text x="270" y="631" text-anchor="middle" class="txt">Compute candidate position and velocity</text><text x="270" y="656" text-anchor="middle" class="small">Independent hare work; no shared writes</text><rect x="70" y="700" width="400" height="80" rx="15" class="box"/><text x="270" y="731" text-anchor="middle" class="txt">Evaluate f(Xnew) in parallel</text><text x="270" y="756" text-anchor="middle" class="small">Each thread owns candidate fitness</text><rect x="70" y="800" width="400" height="80" rx="15" class="vbox"/><text x="270" y="831" text-anchor="middle" class="txt">Deterministic fitness / index ordering</text><text x="270" y="856" text-anchor="middle" class="small">Stable tie rule for reproducible selection</text><rect x="550" y="145" width="500" height="865" rx="20" class="panel"/><rect x="568" y="159" width="268" height="38" rx="18" fill="#e8ddff"/><text x="586" y="185" class="pt">Host execution flow</text><rect x="610" y="215" width="380" height="65" rx="15" class="vbox"/><text x="800" y="246" text-anchor="middle" class="txt">Start • read N, D, T, function and seed</text><path d="M800 280 L800 310" class="line"/><rect x="610" y="310" width="380" height="65" rx="15" class="box"/><text x="800" y="341" text-anchor="middle" class="txt">Set OpenMP thread count</text><path d="M800 375 L800 405" class="line"/><rect x="610" y="405" width="380" height="65" rx="15" class="box"/><text x="800" y="436" text-anchor="middle" class="txt">Allocate population, candidate and fitness arrays</text><path d="M800 470 L800 500" class="line"/><rect x="610" y="500" width="380" height="65" rx="15" class="box"/><text x="800" y="531" text-anchor="middle" class="txt">Parallel initialization and initial evaluation</text><path d="M800 565 L800 595" class="line"/><rect x="610" y="595" width="380" height="65" rx="15" class="box"/><text x="800" y="626" text-anchor="middle" class="txt">Set iteration t = 1</text><path d="M800 660 L800 690" class="line"/><rect x="590" y="690" width="420" height="150" rx="15" class="vbox"/><text x="800" y="721" text-anchor="middle" class="txt">For each iteration t = 1 … T</text><text x="800" y="746" text-anchor="middle" class="small">1  Update hare candidates (parallel)</text><text x="800" y="771" text-anchor="middle" class="small">2  Evaluate candidate fitness (parallel)</text><text x="800" y="796" text-anchor="middle" class="small">3  Sort candidates by (fitness, index)</text><text x="800" y="821" text-anchor="middle" class="small">4  Merge and keep best N survivors</text><path d="M800 840 L800 875" class="line"/><rect x="610" y="875" width="380" height="80" rx="15" class="box"/><text x="800" y="906" text-anchor="middle" class="txt">Repeat until T iterations complete</text><text x="800" y="931" text-anchor="middle" class="small">Return best solution, fitness and runtime</text><rect x="1100" y="145" width="455" height="400" rx="20" class="panel"/><rect x="1118" y="159" width="364" height="38" rx="18" fill="#e8ddff"/><text x="1136" y="185" class="pt">Parallel work and selection</text><rect x="1130" y="215" width="395" height="75" rx="15" class="vbox"/><text x="1327.5" y="246" text-anchor="middle" class="txt">#pragma omp parallel for</text><text x="1327.5" y="271" text-anchor="middle" class="small">Initialize / update / evaluate</text><rect x="1130" y="310" width="395" height="75" rx="15" class="box"/><text x="1327.5" y="341" text-anchor="middle" class="txt">Deterministic RNG</text><text x="1327.5" y="366" text-anchor="middle" class="small">Independent work per hare</text><rect x="1130" y="405" width="395" height="75" rx="15" class="box"/><text x="1327.5" y="436" text-anchor="middle" class="txt">Sort and select survivors</text><text x="1327.5" y="461" text-anchor="middle" class="small">Keep best N of 2N</text><rect x="1100" y="585" width="455" height="425" rx="20" class="panel"/><rect x="1118" y="599" width="280" height="38" rx="18" fill="#e8ddff"/><text x="1136" y="625" class="pt">Implementation notes</text><rect x="1130" y="655" width="395" height="85" rx="15" class="box"/><text x="1327.5" y="686" text-anchor="middle" class="txt">Model: shared-memory OpenMP</text><text x="1327.5" y="711" text-anchor="middle" class="small">Thread count: configurable</text><rect x="1130" y="760" width="395" height="85" rx="15" class="box"/><text x="1327.5" y="791" text-anchor="middle" class="txt">CPU build: g++ -O3 -fopenmp</text><text x="1327.5" y="816" text-anchor="middle" class="small">C++17 • contraction disabled</text><rect x="1130" y="865" width="395" height="85" rx="15" class="box"/><text x="1327.5" y="896" text-anchor="middle" class="txt">Parity goal: bit-identical to seq</text><text x="1327.5" y="921" text-anchor="middle" class="small">Same RNG and arithmetic order</text><text x="800" y="1055" text-anchor="middle" class="muted">Algorithm details follow heo_common.h: X′ = clamp(X + cₜV + L(X + V)r); V′ = 0.95V</text></svg>